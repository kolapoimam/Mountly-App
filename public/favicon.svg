<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="driveAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#border)" stroke-width="2" />

  <!-- Hard Drive Icon matching Mountly Logo -->
  <g transform="translate(14, 14)">
    <!-- Drive Outer Case -->
    <rect x="2" y="4" width="32" height="28" rx="5" fill="none" stroke="url(#driveAccent)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Drive Platter / Upper Window -->
    <path d="M7 11h22" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5" />
    <circle cx="18" cy="18" r="4.5" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <circle cx="18" cy="18" r="1.5" fill="#93c5fd" />

    <!-- Internal head actuator arm -->
    <path d="M22 22l4 4" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lower Bay Divider Line -->
    <line x1="2" y1="24" x2="34" y2="24" stroke="url(#driveAccent)" stroke-width="2.2" />

    <!-- Status Indicator LED -->
    <circle cx="28" cy="27.5" r="1.5" fill="#38bdf8" filter="url(#glow)" />
    <!-- Small drive slot / read activity notch -->
    <line x1="7" y1="27.5" x2="16" y2="27.5" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
